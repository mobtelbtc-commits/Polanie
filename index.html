    // --- 7. MISSION GENERATOR ---
    loadMission(missionNum) {
        const req = Math.max(1, Math.min(10, Number(missionNum)));
        if (req > this.unlockedLevel) return;
        this.currentMission = req;
        this.missionCfg = MISSIONS[this.currentMission - 1];
        document.getElementById('missionSelect').value = this.currentMission;

        this.units = []; this.buildings = []; this.projectiles = []; this.particles = []; this.floatingTexts = [];
        this.selectedUnits = []; this.selectedBuilding = null; this.commandMode = null; this.buildingToPlace = null; this.pendingBuildTile = null;
        this.gameOver = false; this.aiTimer = 0;

        this.map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(TILES.GRASS));
        this.grassRegenTimer = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));
        this.fog = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));

        for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
            if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) { this.map[y][x] = TILES.ROCK; continue; }
            const n = Math.sin(x * 0.35 + this.currentMission * 1.7) * Math.cos(y * 0.35) + Math.sin((x + y) * 0.22);
            if (n > 0.72) this.map[y][x] = TILES.FOREST;
            else if (n < -0.25) this.map[y][x] = TILES.LUSH_GRASS;
        }

        const mt = this.missionCfg.mapType;
        if (mt === 'bridge_center') {
            for (let x = 10; x < MAP_W - 1; x++) { const ry = Math.floor(22 + Math.sin(x * 0.25) * 2); this.map[ry][x] = TILES.WATER; this.map[ry + 1][x] = TILES.WATER; }
            for (let dy = -1; dy <= 2; dy++) { this.map[22 + dy][22] = TILES.BRIDGE; this.map[22 + dy][23] = TILES.BRIDGE; }
        } else if (mt === 'river_no_bridge') {
            for (let x = 1; x < MAP_W - 1; x++) { const ry = Math.floor(21 + Math.cos(x * 0.2) * 2); this.map[ry][x] = TILES.WATER; this.map[ry + 1][x] = TILES.WATER; }
        } else if (mt === 'dense_forest_wall') {
            for (let x = 1; x < MAP_W - 1; x++) for (let y = 19; y <= 24; y++) this.map[y][x] = TILES.FOREST;
        } else if (mt === 'vertical_river') {
            for (let y = 1; y < MAP_H - 1; y++) {
                if (y < 17 || y > 24) { this.map[y][22] = TILES.WATER; this.map[y][23] = TILES.WATER; }
                else { this.map[y][22] = TILES.BRIDGE; this.map[y][23] = TILES.BRIDGE; }
            }
        } else if (mt === 'twin_rivers') {
            for (let x = 1; x < MAP_W - 1; x++) { this.map[16][x] = TILES.WATER; this.map[17][x] = TILES.WATER; this.map[26][x] = TILES.WATER; this.map[27][x] = TILES.WATER; }
            this.map[26][15] = TILES.BRIDGE; this.map[27][15] = TILES.BRIDGE; this.map[16][29] = TILES.BRIDGE; this.map[17][29] = TILES.BRIDGE;
            this.createPasture(17, 19, 27, 24);
        } else if (mt === 'rock_pass') {
            for (let x = 1; x < MAP_W - 1; x++) if (x < 19 || x > 24) { this.map[20][x] = TILES.ROCK; this.map[21][x] = TILES.ROCK; }
        }

        this.clearArea(3, 28, 15, 41, TILES.GRASS); this.createPasture(4, 35, 11, 40);
        this.clearArea(26, 3, 41, 18, TILES.GRASS); this.createPasture(34, 4, 40, 10);
        if (this.currentMission === 7) this.clearArea(28, 29, 40, 38, TILES.GRASS);

        this.milk = this.missionCfg.startMilk; this.enemyMilk = this.missionCfg.enemyMilk;
        this.spawnBuilding('obora', 6, 31, FACTION.PLAYER, true);
        this.spawnBuilding('drwalnia', 11, 31, FACTION.PLAYER, true);

        this.missionCfg.playerUnits.forEach((uType, idx) => {
            const tx = 6 + (idx % 4) * 1.8;
            const ty = uType === 'krowa' ? 36.5 + (idx % 2) : 29.5 + Math.floor(idx / 4) * 1.4;
            this.spawnUnit(uType, tx, ty, FACTION.PLAYER);
        });
        this.missionCfg.enemyBuildings.forEach(([bType, bx, by]) => this.spawnBuilding(bType, bx, by, FACTION.ENEMY, true));
        this.missionCfg.enemyUnits.forEach(([uType, ux, uy]) => this.spawnUnit(uType, ux, uy, FACTION.ENEMY));

        this.recalcMilkCap();
        this.centerCameraOn(9 * TILE_SIZE, 33 * TILE_SIZE);
        this.setTab('recruit');
        this.applyLanguageUI(); this.updateVision(); this.updateUI();
        this.setTicker(this.t('welcomeTicker'));
    }

    clearArea(x1, y1, x2, y2, tile = TILES.GRASS) { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) if (this.inBounds(x, y)) this.map[y][x] = tile; }
    createPasture(x1, y1, x2, y2) { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) if (this.inBounds(x, y)) this.map[y][x] = TILES.LUSH_GRASS; }
    inBounds(tx, ty) { return tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H; }
    isWalkable(tx, ty) {
        if (!this.inBounds(tx, ty)) return false;
        const t = this.map[ty][tx];
        if (t === TILES.FOREST || t === TILES.WATER || t === TILES.ROCK) return false;
        for (const b of this.buildings) if (b.hp > 0 && tx >= b.tx && tx < b.tx + b.size && ty >= b.ty && ty < b.ty + b.size) return false;
        return true;
    }

    findWalkableAround(b) {
        for (let r = 1; r <= 3; r++) {
            for (let dx = -r; dx <= b.size + r - 1; dx++) {
                for (let dy = -r; dy <= b.size + r - 1; dy++) {
                    const tx = b.tx + dx, ty = b.ty + dy;
                    if (this.isWalkable(tx, ty)) return { tx: tx + 0.5, ty: ty + 0.5 };
                }
            }
        }
        return { tx: b.tx + b.size / 2, ty: Math.min(MAP_H - 2, b.ty + b.size + 0.5) };
    }

    spawnUnit(typeId, tx, ty, faction) {
        const def = UNIT_DEFS[typeId]; if (!def) return null;
        const unit = {
            uid: Math.random().toString(36).slice(2), type: typeId, def, faction,
            x: tx * TILE_SIZE, y: ty * TILE_SIZE, hp: def.hp, maxHp: def.hp,
            mana: def.maxMana || 0, maxMana: def.maxMana || 0, milk: 0,
            state: def.isCow ? 'graze' : 'idle', targetX: tx * TILE_SIZE, targetY: ty * TILE_SIZE,
            targetEntity: null, targetTile: null, attackCooldown: 0, animFrame: Math.random() * 10, dir: 1
        };
        this.units.push(unit); return unit;
    }

    spawnBuilding(typeId, tx, ty, faction, instant = false) {
        const def = BUILDING_DEFS[typeId]; if (!def) return null;
        for (let y = ty; y < ty + def.size; y++) for (let x = tx; x < tx + def.size; x++) if (this.inBounds(x, y)) this.map[y][x] = TILES.DIRT;
        const b = {
            uid: Math.random().toString(36).slice(2), type: typeId, def, faction, tx, ty, size: def.size,
            x: (tx + def.size / 2) * TILE_SIZE, y: (ty + def.size / 2) * TILE_SIZE,
            hp: instant ? def.hp : Math.floor(def.hp * 0.2), maxHp: def.hp,
            built: instant, buildProgress: instant ? 100 : 10
        };
        this.buildings.push(b); this.recalcMilkCap(); return b;
    }

    recalcMilkCap() {
        let cap = 400;
        for (const b of this.buildings) if (b.faction === FACTION.PLAYER && b.hp > 0 && b.built) cap += b.def.milkCapBonus || 0;
        this.maxMilk = cap;
        if (this.milk > this.maxMilk) this.milk = this.maxMilk;
    }

    // --- 8. UPDATE LOOP ---
    update() {
        if (this.gameOver) return;
        this.tickCount++;
        const camSpeed = 8;
        if (this.keys['KeyW'] || this.keys['ArrowUp']) this.camY -= camSpeed;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) this.camY += camSpeed;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) this.camX -= camSpeed;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) this.camX += camSpeed;
        this.clampCamera();

        for (const p of this.ambientPollen) {
            p.x = (p.x + p.vx) % (MAP_W * TILE_SIZE);
            p.y = (p.y + p.vy) % (MAP_H * TILE_SIZE);
        }

        if (this.tickCount % 90 === 0) {
            for (let y = 1; y < MAP_H - 1; y++) for (let x = 1; x < MAP_W - 1; x++) {
                if (this.map[y][x] === TILES.DIRT) {
                    this.grassRegenTimer[y][x]++;
                    if (this.grassRegenTimer[y][x] > 6) { this.map[y][x] = TILES.GRASS; this.grassRegenTimer[y][x] = 0; }
                } else if (this.map[y][x] === TILES.GRASS && Math.random() < 0.08) this.map[y][x] = TILES.LUSH_GRASS;
            }
        }

        for (const b of this.buildings) {
            if (b.hp <= 0) continue;
            if (!b.built) {
                b.buildProgress += 0.45;
                b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.004);
                if (b.buildProgress >= 100) {
                    b.built = true; b.hp = b.maxHp; this.recalcMilkCap();
                    if (b.faction === FACTION.PLAYER) { this.setTicker(this.t('msgBuilt')(this.entName(b.def))); sfx.play('build'); }
                }
            }
            if (b.hp < b.maxHp * 0.5 && Math.random() < 0.2) {
                this.particles.push({ x: b.x + (Math.random() - 0.5) * b.size * 20, y: b.y + (Math.random() - 0.5) * b.size * 20, vx: (Math.random() - 0.5) * 0.4, vy: -0.9, color: Math.random() < 0.5 ? '#ef4444' : '#f59e0b', life: 20 });
            }
        }

        for (const u of this.units) {
            if (u.hp <= 0) continue;
            if (u.attackCooldown > 0) u.attackCooldown--;
            if (u.maxMana > 0 && u.mana < u.maxMana) u.mana = Math.min(u.maxMana, u.mana + 0.06);
            if (u.def.isCow) this.updateCow(u); else this.updateCombatOrWorkerUnit(u);

            for (const other of this.units) {
                if (other === u || other.hp <= 0) continue;
                const dx = u.x - other.x, dy = u.y - other.y, dist = Math.hypot(dx, dy);
                if (dist > 0 && dist < 18) {
                    const push = (18 - dist) * 0.08;
                    const nx = u.x + (dx / dist) * push, ny = u.y + (dy / dist) * push;
                    if (this.isWalkable(Math.floor(nx / TILE_SIZE), Math.floor(ny / TILE_SIZE))) { u.x = nx; u.y = ny; }
                }
            }
        }

        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const p = this.projectiles[i];
            const dx = p.targetX - p.x, dy = p.targetY - p.y, dist = Math.hypot(dx, dy);
            if (dist < p.speed) {
                if (p.target && p.target.hp > 0) {
                    p.target.hp -= Math.max(2, p.damage - (p.target.def.armor || 0));
                    this.spawnHitParticles(p.target.x, p.target.y, p.type === 'lightning' ? '#38bdf8' : '#ef4444');
                }
                this.projectiles.splice(i, 1);
            } else { p.x += (dx / dist) * p.speed; p.y += (dy / dist) * p.speed; }
        }

        const prevB = this.buildings.length;
        this.units = this.units.filter(u => u.hp > 0);
        this.buildings = this.buildings.filter(b => b.hp > 0);
        this.selectedUnits = this.selectedUnits.filter(u => u.hp > 0);
        if (this.selectedBuilding && this.selectedBuilding.hp <= 0) this.selectedBuilding = null;
        if (this.buildings.length !== prevB) { this.recalcMilkCap(); this.checkWinCondition(); }

        for (let i = this.particles.length - 1; i >= 0; i--) { const pt = this.particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life--; if (pt.life <= 0) this.particles.splice(i, 1); }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) { const ft = this.floatingTexts[i]; ft.y -= 0.45; ft.life--; if (ft.life <= 0) this.floatingTexts.splice(i, 1); }

        this.updateEnemyAI();
        if (this.tickCount % 6 === 0) { this.updateVision(); this.updateUI(); }
    }

    updateCow(cow) {
        const tx = Math.floor(cow.x / TILE_SIZE), ty = Math.floor(cow.y / TILE_SIZE);
        if (cow.state === 'move') { if (this.moveUnitToward(cow, cow.targetX, cow.targetY)) cow.state = 'graze'; return; }
        if (cow.state === 'return_milk') {
            const shed = this.findNearestShed(cow);
            if (!shed) { cow.state = 'graze'; return; }
            if (Math.hypot(shed.x - cow.x, shed.y - cow.y) < (shed.size * TILE_SIZE) * 0.72) {
                const amount = Math.floor(cow.milk * 0.95);
                if (cow.faction === FACTION.PLAYER) {
                    this.milk = Math.min(this.maxMilk, this.milk + amount);
                    this.addFloatingText(`+${amount} 🥛`, shed.x, shed.y - 16, '#fff');
                    if (Math.random() < 0.25) sfx.play('moo');
                } else this.enemyMilk += amount;
                cow.milk = 0; cow.state = 'graze';
            } else this.moveUnitToward(cow, shed.x, shed.y);
            return;
        }
        if (cow.milk >= 100) { cow.milk = 100; cow.state = 'return_milk'; return; }
        const t = this.inBounds(tx, ty) ? this.map[ty][tx] : TILES.DIRT;
        if (t === TILES.LUSH_GRASS || t === TILES.GRASS) {
            cow.milk = Math.min(100, cow.milk + (t === TILES.LUSH_GRASS ? 0.28 : 0.12));
            cow.animFrame += 0.08;
            if (Math.random() < 0.004) this.map[ty][tx] = t === TILES.LUSH_GRASS ? TILES.GRASS : TILES.DIRT;
        } else {
            if (!cow.targetTile || this.map[cow.targetTile.ty]?.[cow.targetTile.tx] === TILES.DIRT) cow.targetTile = this.findNearestLushGrass(tx, ty);
            if (cow.targetTile && this.moveUnitToward(cow, (cow.targetTile.tx + 0.5) * TILE_SIZE, (cow.targetTile.ty + 0.5) * TILE_SIZE)) cow.targetTile = null;
        }
    }

    findNearestLushGrass(sx, sy) {
        let best = null, bestD = 999;
        for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++) {
            const nx = sx + dx, ny = sy + dy;
            if (!this.inBounds(nx, ny)) continue;
            const t = this.map[ny][nx];
            if (t === TILES.LUSH_GRASS || t === TILES.GRASS) {
                const d = Math.hypot(dx, dy) + (t === TILES.GRASS ? 2.5 : 0);
                if (d < bestD) { bestD = d; best = { tx: nx, ty: ny }; }
            }
        }
        return best;
    }

    findNearestShed(unit) {
        let best = null, bestD = Infinity;
        for (const b of this.buildings) if (b.faction === unit.faction && b.type === 'obora' && b.built && b.hp > 0) {
            const d = Math.hypot(b.x - unit.x, b.y - unit.y);
            if (d < bestD) { bestD = d; best = b; }
        }
        return best;
    }

    updateCombatOrWorkerUnit(u) {
        if (u.state === 'chop' && u.targetTile) {
            const { tx, ty } = u.targetTile;
            if (!this.inBounds(tx, ty) || this.map[ty][tx] !== TILES.FOREST) {
                const next = this.findNearestForest(Math.floor(u.x / TILE_SIZE), Math.floor(u.y / TILE_SIZE));
                if (next) u.targetTile = next; else u.state = 'idle';
                return;
            }
            const treeX = (tx + 0.5) * TILE_SIZE, treeY = (ty + 0.5) * TILE_SIZE;
            if (Math.hypot(treeX - u.x, treeY - u.y) <= TILE_SIZE * 1.45) {
                u.animFrame += 0.25;
                if (u.attackCooldown <= 0) {
                    u.attackCooldown = 35; sfx.play('chop'); this.spawnHitParticles(treeX, treeY, '#a67c52');
                    if (Math.random() < 0.35) {
                        this.map[ty][tx] = TILES.STUMP;
                        if (u.faction === FACTION.PLAYER) { this.milk = Math.min(this.maxMilk, this.milk + 25); this.addFloatingText('+25 🌲', treeX, treeY - 10, '#a3e635'); }
                    }
                }
            } else this.moveUnitToward(u, treeX, treeY, true);
            return;
        }
        if (u.state === 'build_bridge' && u.targetTile) {
            const { tx, ty } = u.targetTile, bx = (tx + 0.5) * TILE_SIZE, by = (ty + 0.5) * TILE_SIZE;
            if (Math.hypot(bx - u.x, by - u.y) <= TILE_SIZE * 1.7) {
                if (this.map[ty][tx] === TILES.WATER) { this.map[ty][tx] = TILES.BRIDGE; sfx.play('build'); this.addFloatingText(this.t('msgBridgeDone'), bx, by - 12, '#fde047'); }
                u.state = 'idle';
            } else this.moveUnitToward(u, bx, by, true);
            return;
        }
        if (u.state === 'move') { if (this.moveUnitToward(u, u.targetX, u.targetY)) u.state = 'idle'; return; }
        if (u.state === 'patrol') {
            const enemy = this.findNearestEnemy(u, u.def.sight * TILE_SIZE);
            if (enemy) { u.targetEntity = enemy; u.state = 'attack'; return; }
            if (this.moveUnitToward(u, u.targetX, u.targetY)) {
                const tx = u.targetX, ty = u.targetY;
                u.targetX = u.patrolOriginX || u.x; u.targetY = u.patrolOriginY || u.y;
                u.patrolOriginX = tx; u.patrolOriginY = ty;
            }
            return;
        }
        if (!u.targetEntity || u.targetEntity.hp <= 0) {
            u.targetEntity = this.findNearestEnemy(u, u.def.sight * TILE_SIZE);
            if (!u.targetEntity && u.state === 'attack') { if (this.moveUnitToward(u, u.targetX, u.targetY)) u.state = 'idle'; return; }
        }
        if (u.targetEntity && u.targetEntity.hp > 0) {
            const target = u.targetEntity;
            const targetRadius = target.size ? (target.size * TILE_SIZE) * 0.5 : 10;
            const dist = Math.hypot(target.x - u.x, target.y - u.y) - targetRadius;
            if (dist <= u.def.range * TILE_SIZE) {
                u.dir = target.x >= u.x ? 1 : -1; u.animFrame += 0.25;
                if (u.attackCooldown <= 0) {
                    u.attackCooldown = 42;
                    if (u.def.projectile) {
                        if (u.def.projectile === 'lightning') sfx.play('lightning');
                        this.projectiles.push({ type: u.def.projectile, x: u.x, y: u.y - 8, targetX: target.x, targetY: target.y, target, damage: u.def.damage, speed: u.def.projectile === 'lightning' ? 9 : 6 });
                    } else {
                        sfx.play('sword');
                        target.hp -= Math.max(2, u.def.damage - (target.def?.armor || 0));
                        this.spawnHitParticles(target.x, target.y, '#ef4444');
                    }
                }
            } else this.moveUnitToward(u, target.x, target.y, true);
        }
    }

    findNearestForest(tx, ty) {
        let best = null, bestD = 8;
        for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) {
            const nx = tx + dx, ny = ty + dy;
            if (this.inBounds(nx, ny) && this.map[ny][nx] === TILES.FOREST) { const d = Math.hypot(dx, dy); if (d < bestD) { bestD = d; best = { tx: nx, ty: ny }; } }
        }
        return best;
    }

    findNearestEnemy(unit, maxRange) {
        let best = null, bestD = maxRange;
        for (const o of this.units) if (o.faction !== unit.faction && o.hp > 0) { const d = Math.hypot(o.x - unit.x, o.y - unit.y); if (d < bestD) { bestD = d; best = o; } }
        if (!best) for (const b of this.buildings) if (b.faction !== unit.faction && b.hp > 0) { const d = Math.hypot(b.x - unit.x, b.y - unit.y); if (d < bestD) { bestD = d; best = b; } }
        return best;
    }

    moveUnitToward(u, destX, destY, stopAdjacent = false) {
        const dx = destX - u.x, dy = destY - u.y, dist = Math.hypot(dx, dy);
        if (dist < (stopAdjacent ? 20 : 6)) return true;
        u.dir = dx >= 0 ? 1 : -1; u.animFrame += 0.22;
        const vx = (dx / dist) * u.def.speed, vy = (dy / dist) * u.def.speed;
        const nx = u.x + vx, ny = u.y + vy;
        if (this.isWalkable(Math.floor(nx / TILE_SIZE), Math.floor(ny / TILE_SIZE))) { u.x = nx; u.y = ny; }
        else if (this.isWalkable(Math.floor((u.x + vx) / TILE_SIZE), Math.floor(u.y / TILE_SIZE))) u.x += vx;
        else if (this.isWalkable(Math.floor(u.x / TILE_SIZE), Math.floor((u.y + vy) / TILE_SIZE))) u.y += vy;
        else {
            const px = u.x + (-dy / dist) * u.def.speed, py = u.y + (dx / dist) * u.def.speed;
            if (this.isWalkable(Math.floor(px / TILE_SIZE), Math.floor(py / TILE_SIZE))) { u.x = px; u.y = py; }
            else if (stopAdjacent) return true;
        }
        return false;
    }

    updateEnemyAI() {
        this.aiTimer++;
        const cfg = this.missionCfg;
        if (this.aiTimer % 180 !== 0) return;
        this.enemyMilk += cfg.aiIncome;
        const enemyB = this.buildings.filter(b => b.faction === FACTION.ENEMY && b.built);
        if (enemyB.length === 0) return;
        const fighters = this.units.filter(u => u.faction === FACTION.ENEMY && !u.def.isCow);
        if (this.enemyMilk >= 210 && fighters.length < cfg.aiCap) {
            const spawner = enemyB.find(b => b.type !== 'obora') || enemyB[0];
            const pick = cfg.enemyPool[Math.floor(Math.random() * cfg.enemyPool.length)];
            const pos = this.findWalkableAround(spawner);
            this.enemyMilk -= 200;
            this.spawnUnit(pick, pos.tx, pos.ty, FACTION.ENEMY);
        }
        if (fighters.length >= cfg.raidAt && this.aiTimer % cfg.raidFreq === 0) {
            const target = this.buildings.find(b => b.faction === FACTION.PLAYER) || this.units.find(u => u.faction === FACTION.PLAYER);
            if (target) {
                this.setTicker(this.t('msgEnemyRaid'));
                for (const f of fighters) { f.state = 'attack'; f.targetX = target.x; f.targetY = target.y; }
            }
        }
    }

    updateVision() {
        for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (this.fog[y][x] === 2) this.fog[y][x] = 1;
        const reveal = (cx, cy, r) => {
            const r2 = r * r;
            for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r2 && this.inBounds(cx + dx, cy + dy)) this.fog[cy + dy][cx + dx] = 2;
        };
        for (const u of this.units) if (u.faction === FACTION.PLAYER && u.hp > 0) reveal(Math.floor(u.x / TILE_SIZE), Math.floor(u.y / TILE_SIZE), u.def.sight);
        for (const b of this.buildings) if (b.faction === FACTION.PLAYER && b.hp > 0) reveal(Math.floor(b.x / TILE_SIZE), Math.floor(b.y / TILE_SIZE), b.def.sight);
    }

    checkWinCondition() {
        const pAll = this.buildings.filter(b => b.faction === FACTION.PLAYER).length + this.units.filter(u => u.faction === FACTION.PLAYER).length;
        const eBld = this.buildings.filter(b => b.faction === FACTION.ENEMY).length;
        if (eBld === 0 && !this.gameOver) { this.gameOver = true; this.unlockNextLevel(); this.showEndModal(true); }
        else if (pAll === 0 && !this.gameOver) { this.gameOver = true; this.showEndModal(false); }
    }

    showEndModal(victory) {
        const modal = document.getElementById('modalOverlay');
        const actBtn = document.getElementById('modalActionBtn');
        const hasNext = this.currentMission < 10;
        if (victory) {
            document.getElementById('modalTitle').textContent = this.t('victoryTitle');
            document.getElementById('modalContent').innerHTML = this.t('victoryBody')(hasNext);
            actBtn.textContent = hasNext ? this.t('nextMissionBtn') : this.t('restartBtn');
            actBtn.onclick = () => { modal.classList.add('hidden'); this.loadMission(hasNext ? this.currentMission + 1 : 1); };
        } else {
            document.getElementById('modalTitle').textContent = this.t('defeatTitle');
            document.getElementById('modalContent').innerHTML = this.t('defeatBody');
            actBtn.textContent = this.t('restartBtn');
            actBtn.onclick = () => { modal.classList.add('hidden'); this.loadMission(this.currentMission); };
        }
        modal.classList.remove('hidden');
    }

    // --- 9. UPGRADED PAINTERLY GRAPHICS RENDERER ---
    render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const viewW = this.canvas.width / this.zoom, viewH = this.canvas.height / this.zoom;
        const sc = Math.max(0, Math.floor(this.camX / TILE_SIZE)), ec = Math.min(MAP_W - 1, Math.ceil((this.camX + viewW) / TILE_SIZE));
        const sr = Math.max(0, Math.floor(this.camY / TILE_SIZE)), er = Math.min(MAP_H - 1, Math.ceil((this.camY + viewH) / TILE_SIZE));

        ctx.save();
        ctx.scale(this.zoom, this.zoom);
        ctx.translate(-Math.floor(this.camX), -Math.floor(this.camY));

        // 1. Terrain with organic tile variants & gentle water shimmer
        for (let y = sr; y <= er; y++) for (let x = sc; x <= ec; x++) {
            if (this.fog[y][x] === 0) continue;
            const t = this.map[y][x];
            ctx.drawImage(this.art.getTile(t, x, y), x * TILE_SIZE, y * TILE_SIZE);

            // Soft sandy riverbank & animated water sparkle
            if (t === TILES.WATER) {
                if (this.inBounds(x, y - 1) && this.map[y - 1][x] !== TILES.WATER && this.map[y - 1][x] !== TILES.BRIDGE) {
                    ctx.fillStyle = 'rgba(217, 185, 130, 0.55)';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, 3);
                }
                if ((x + y + Math.floor(this.tickCount / 22)) % 5 === 0) {
                    ctx.fillStyle = 'rgba(224, 242, 254, 0.5)';
                    ctx.fillRect(x * TILE_SIZE + 8, y * TILE_SIZE + 14, 7, 2);
                }
            }
        }

        // 2. Buildings
        for (const b of this.buildings) if ((this.fog[b.ty]?.[b.tx] || 0) > 0) this.drawBuilding(ctx, b);

        // 3. Units
        const sorted = [...this.units].sort((a, b) => a.y - b.y);
        for (const u of sorted) {
            const utx = Math.floor(u.x / TILE_SIZE), uty = Math.floor(u.y / TILE_SIZE);
            if (!this.inBounds(utx, uty) || (u.faction === FACTION.ENEMY && this.fog[uty][utx] !== 2)) continue;
            this.drawUnit(ctx, u);
        }

        // 4. Projectiles & Particles
        for (const p of this.projectiles) {
            ctx.strokeStyle = p.type === 'lightning' ? '#38bdf8' : '#fde047';
            ctx.lineWidth = p.type === 'lightning' ? 2.5 : 2;
            ctx.beginPath();
            if (p.type === 'lightning') { ctx.moveTo(p.x, p.y - 24); ctx.lineTo(p.x + (Math.random() - 0.5) * 12, p.y - 12); ctx.lineTo(p.x, p.y); }
            else { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 6, p.y - 3); }
            ctx.stroke();
        }
        for (const pt of this.particles) { ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2); ctx.fill(); }

        // Ambient floating sunlight pollen
        ctx.fillStyle = 'rgba(254, 249, 195, 0.38)';
        for (const p of this.ambientPollen) {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }

        ctx.font = 'bold 14px sans-serif';
        for (const ft of this.floatingTexts) { ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(ft.text, ft.x - 15, ft.y + 1); ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x - 16, ft.y); }

        // 5. Fog of War
        for (let y = sr; y <= er; y++) for (let x = sc; x <= ec; x++) {
            const f = this.fog[y][x];
            if (f === 0) { ctx.fillStyle = '#0c120c'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE); }
            else if (f === 1) { ctx.fillStyle = 'rgba(10, 18, 12, 0.42)'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE); }
        }

        // 6. Building Placement Preview
        if (this.commandMode && this.commandMode.startsWith('build_') && this.buildingToPlace) {
            const def = BUILDING_DEFS[this.buildingToPlace];
            const gx = this.pendingBuildTile ? this.pendingBuildTile.tx : Math.floor(this.mouse.worldX / TILE_SIZE);
            const gy = this.pendingBuildTile ? this.pendingBuildTile.ty : Math.floor(this.mouse.worldY / TILE_SIZE);
            const valid = this.canPlaceBuilding(gx, gy, def.size);
            ctx.fillStyle = valid ? 'rgba(34, 197, 94, 0.42)' : 'rgba(239, 68, 68, 0.48)';
            ctx.strokeStyle = valid ? '#4ade80' : '#ef4444'; ctx.lineWidth = 3;
            ctx.fillRect(gx * TILE_SIZE, gy * TILE_SIZE, def.size * TILE_SIZE, def.size * TILE_SIZE);
            ctx.strokeRect(gx * TILE_SIZE, gy * TILE_SIZE, def.size * TILE_SIZE, def.size * TILE_SIZE);
        }
        ctx.restore();

        if (this.mouse.drag) {
            ctx.strokeStyle = '#84cc16'; ctx.lineWidth = 1.5; ctx.fillStyle = 'rgba(132, 204, 22, 0.15)';
            const rx = Math.min(this.mouse.startX, this.mouse.x), ry = Math.min(this.mouse.startY, this.mouse.y);
            ctx.fillRect(rx, ry, Math.abs(this.mouse.x - this.mouse.startX), Math.abs(this.mouse.y - this.mouse.startY));
            ctx.strokeRect(rx, ry, Math.abs(this.mouse.x - this.mouse.startX), Math.abs(this.mouse.y - this.mouse.startY));
        }
        this.renderMinimap();
    }

    drawBuilding(ctx, b) {
        const px = b.tx * TILE_SIZE, py = b.ty * TILE_SIZE, pw = b.size * TILE_SIZE, ph = b.size * TILE_SIZE;
        const flag = b.faction === FACTION.PLAYER ? '#2563eb' : '#dc2626';
        const flagLight = b.faction === FACTION.PLAYER ? '#60a5fa' : '#f87171';

        if (this.selectedBuilding === b) { ctx.strokeStyle = '#a3e635'; ctx.lineWidth = 2; ctx.strokeRect(px - 2, py - 2, pw + 4, ph + 4); }
        // Soft ground shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath(); ctx.roundRect(px + 6, py + 12, pw - 4, ph - 6, 6); ctx.fill();

        if (!b.built) {
            ctx.fillStyle = '#6c4427'; ctx.fillRect(px + 6, py + 12, pw - 12, ph - 16);
            ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2;
            for (let i = 10; i < pw - 10; i += 14) { ctx.beginPath(); ctx.moveTo(px + i, py + 8); ctx.lineTo(px + i, py + ph - 6); ctx.stroke(); }
            ctx.strokeRect(px + 6, py + 12, pw - 12, ph - 16);
        } else if (b.type === 'obora') {
            // Log walls with warm gradient
            const wGrad = ctx.createLinearGradient(px, py + 30, px, py + 62);
            wGrad.addColorStop(0, '#8d5524'); wGrad.addColorStop(1, '#5c3317');
            ctx.fillStyle = wGrad; ctx.fillRect(px + 8, py + 30, pw - 16, 32);
            ctx.fillStyle = 'rgba(0,0,0,0.28)'; for (let ly = 36; ly < 60; ly += 6) ctx.fillRect(px + 8, py + ly, pw - 16, 1.5);
            // Barn door
            ctx.fillStyle = '#3b2110'; ctx.fillRect(px + pw / 2 - 11, py + 42, 22, 20);
            ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1.5; ctx.strokeRect(px + pw / 2 - 11, py + 42, 22, 20);
            // Shaded golden straw roof
            const rGrad = ctx.createLinearGradient(px, py + 6, px, py + 34);
            rGrad.addColorStop(0, '#facc15'); rGrad.addColorStop(1, '#b45309');
            ctx.fillStyle = rGrad;
            ctx.beginPath(); ctx.moveTo(px + 3, py + 34); ctx.lineTo(px + pw / 2, py + 5); ctx.lineTo(px + pw - 3, py + 34); ctx.closePath(); ctx.fill();
            ctx.fillStyle = flag; ctx.fillRect(px + pw / 2 - 6, py + 16, 12, 10);
            ctx.fillStyle = '#fff'; ctx.fillRect(px + pw / 2 - 2, py + 18, 4, 6);
            // Corral + hay
            ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.roundRect(px + 14, py + 71, 18, 10, 3); ctx.fill();
            ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2; ctx.strokeRect(px + 8, py + 64, pw - 16, 24);
        } else if (b.type === 'drwalnia') {
            ctx.fillStyle = '#78350f'; ctx.fillRect(px + 6, py + 24, pw - 12, 26);
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (let ly = 29; ly < 48; ly += 5) ctx.fillRect(px + 6, py + ly, pw - 12, 1.5);
            const rGrad = ctx.createLinearGradient(px, py + 6, px, py + 26);
            rGrad.addColorStop(0, '#c2410c'); rGrad.addColorStop(1, '#7c2d12');
            ctx.fillStyle = rGrad;
            ctx.beginPath(); ctx.moveTo(px + 2, py + 26); ctx.lineTo(px + pw / 2, py + 5); ctx.lineTo(px + pw - 2, py + 26); ctx.closePath(); ctx.fill();
            ctx.fillStyle = flag; ctx.fillRect(px + pw / 2 - 5, py + 14, 10, 6);
            ctx.fillStyle = '#291509'; ctx.fillRect(px + 12, py + 34, 10, 16);
            // Warm glowing cabin window
            ctx.fillStyle = '#fef08a'; ctx.fillRect(px + 34, py + 32, 10, 8);
            ctx.fillStyle = '#a16207'; ctx.fillRect(px + 8, py + 52, 26, 8);
            ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(px + 35, py + 56, 3.5, 0, Math.PI * 2); ctx.fill();
        } else if (b.type === 'koszary') {
            const sGrad = ctx.createLinearGradient(px, py + 20, px, py + ph);
            sGrad.addColorStop(0, '#78716c'); sGrad.addColorStop(1, '#44403c');
            ctx.fillStyle = sGrad; ctx.fillRect(px + 8, py + 22, pw - 16, ph - 28);
            ctx.fillStyle = '#8c857f'; ctx.fillRect(px + 4, py + 10, 22, 26); ctx.fillRect(px + pw - 26, py + 10, 22, 26);
            ctx.fillStyle = '#a8a29e';
            ctx.fillRect(px + 4, py + 7, 6, 4); ctx.fillRect(px + 14, py + 7, 6, 4);
            ctx.fillRect(px + pw - 26, py + 7, 6, 4); ctx.fillRect(px + pw - 16, py + 7, 6, 4);
            ctx.fillStyle = flag; ctx.fillRect(px + 26, py + 16, pw - 52, 16);
            ctx.fillStyle = flagLight; ctx.fillRect(px + 12, py + 20, 6, 14); ctx.fillRect(px + pw - 18, py + 20, 6, 14);
            ctx.fillStyle = '#1c1917'; ctx.beginPath(); ctx.roundRect(px + pw / 2 - 12, py + ph - 32, 24, 26, [10, 10, 0, 0]); ctx.fill();
            ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(px + pw / 2, py + 43, 6, 0, Math.PI * 2); ctx.fill();
        } else if (b.type === 'swiatynia') {
            ctx.fillStyle = '#52525b'; ctx.fillRect(px + 6, py + 62, pw - 12, 26);
            ctx.fillStyle = '#71717a'; ctx.fillRect(px + 12, py + 34, pw - 24, 34);
            ctx.fillStyle = flag;
            ctx.beginPath(); ctx.moveTo(px + 3, py + 38); ctx.lineTo(px + pw / 2, py + 6); ctx.lineTo(px + pw - 3, py + 38); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#e4e4e7'; ctx.fillRect(px + 20, py + 42, 8, 22); ctx.fillRect(px + pw - 28, py + 42, 8, 22);
            // Pulsing sacred Perun flame
            const pulse = 8 + Math.sin(this.tickCount * 0.1) * 2;
            ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
            ctx.beginPath(); ctx.arc(px + pw / 2, py + 53, pulse + 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(px + pw / 2, py + 53, pulse * 0.7, 0, Math.PI * 2); ctx.fill();
        } else if (b.type === 'stajnia') {
            ctx.fillStyle = '#78350f'; ctx.fillRect(px + 8, py + 30, pw - 16, ph - 38);
            ctx.fillStyle = flag;
            ctx.beginPath(); ctx.moveTo(px + 3, py + 34); ctx.lineTo(px + pw / 2, py + 7); ctx.lineTo(px + pw - 3, py + 34); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#facc15'; ctx.fillRect(px + pw / 2 - 10, py + 20, 20, 6);
            ctx.fillStyle = '#1c1917';
            ctx.beginPath(); ctx.roundRect(px + 16, py + 52, 22, 28, [8, 8, 0, 0]); ctx.fill();
            ctx.beginPath(); ctx.roundRect(px + pw - 38, py + 52, 22, 28, [8, 8, 0, 0]); ctx.fill();
            ctx.fillStyle = '#d97706'; ctx.fillRect(px + 16, py + 66, 22, 3); ctx.fillRect(px + pw - 38, py + 66, 22, 3);
        }

        const hpPct = Math.max(0, b.hp / b.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(px + 6, py - 7, pw - 12, 5);
        ctx.fillStyle = hpPct > 0.5 ? '#22c55e' : hpPct > 0.25 ? '#eab308' : '#ef4444';
        ctx.fillRect(px + 7, py - 6, (pw - 14) * hpPct, 3);
    }

    drawUnit(ctx, u) {
        const x = Math.floor(u.x), y = Math.floor(u.y), bob = Math.sin(u.animFrame) * 1.4;
        const isSel = this.selectedUnits.includes(u);
        if (isSel) { ctx.strokeStyle = '#a3e635'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.ellipse(x, y + 6, 12, 6, 0, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(x, y + 6, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        const team = u.faction === FACTION.PLAYER ? '#2563eb' : '#dc2626';

        if (u.def.isCow) {
            // Rounded, cute cow sprite
            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.roundRect(x - 9, y - 6 + bob, 18, 10, 4); ctx.fill();
            ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(x - 3, y - 2 + bob, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 3, y - 1 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
            if (u.milk > 20) { ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(x, y + 4 + bob, 3, 0, Math.PI * 2); ctx.fill(); }
            const hx = u.dir > 0 ? x + 9 : x - 9;
            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(hx, y - 4 + bob, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.arc(hx + u.dir * 2, y - 3 + bob, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = team; ctx.fillRect(u.dir > 0 ? x + 5 : x - 7, y - 5 + bob, 2, 8);
        } else {
            // Rounded Slavic villager / warrior sprite
            ctx.fillStyle = '#451a03'; ctx.fillRect(x - 4, y + 1, 3, 5 + bob); ctx.fillRect(x + 1, y + 1, 3, 5 - bob);
            ctx.fillStyle = team; ctx.beginPath(); ctx.roundRect(x - 5, y - 8 + bob, 10, 10, 3); ctx.fill();
            ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(x, y - 11 + bob, 4.2, 0, Math.PI * 2); ctx.fill();
            if (u.type === 'drwal') { ctx.fillStyle = '#cbd5e1'; ctx.fillRect(x + u.dir * 6, y - 10 + bob, 5, 6); }
            else if (u.type === 'mysliwy') { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(x + u.dir * 5, y + 3); ctx.lineTo(x + u.dir * 9, y - 14); ctx.stroke(); }
            else if (u.type === 'wojownik') { ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(x, y - 13 + bob, 4.5, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x + u.dir * 6, y - 13 + bob, 3, 9); }
            else if (u.type === 'kaplan') { ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.roundRect(x - 5, y - 8 + bob, 10, 11, 3); ctx.fill(); ctx.fillStyle = '#38bdf8'; ctx.fillRect(x + u.dir * 6, y - 15 + bob, 3, 16); }
            else if (u.type === 'rycerz') { ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.roundRect(x - 9, y - 3 + bob, 18, 8, 3); ctx.fill(); ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.roundRect(x - 5, y - 15 + bob, 10, 11, 3); ctx.fill(); ctx.fillStyle = '#facc15'; ctx.fillRect(x + u.dir * 7, y - 16 + bob, 3, 14); }
        }
        if (isSel || u.hp < u.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(x - 10, y - 21, 20, 4);
            ctx.fillStyle = u.hp / u.maxHp > 0.5 ? '#22c55e' : '#ef4444';
            ctx.fillRect(x - 9, y - 20, 18 * Math.max(0, u.hp / u.maxHp), 2);
            if (u.def.isCow) { ctx.fillStyle = '#000'; ctx.fillRect(x - 10, y - 17, 20, 3); ctx.fillStyle = '#fff'; ctx.fillRect(x - 9, y - 16, 18 * (u.milk / 100), 1.5); }
        }
    }

    renderMinimap() {
        const mCtx = this.miniCtx, mw = this.minimap.width, mh = this.minimap.height, sx = mw / MAP_W, sy = mh / MAP_H;
        mCtx.fillStyle = '#0c120c'; mCtx.fillRect(0, 0, mw, mh);
        for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
            if (this.fog[y][x] === 0) continue;
            const t = this.map[y][x];
            mCtx.fillStyle = t === TILES.WATER ? '#2563eb' : t === TILES.BRIDGE ? '#a16207' : t === TILES.FOREST ? '#1b4d1e' : t === TILES.LUSH_GRASS ? '#74c643' : t === TILES.ROCK ? '#78716c' : '#4c8c32';
            mCtx.fillRect(x * sx, y * sy, Math.ceil(sx), Math.ceil(sy));
        }
        for (const b of this.buildings) if ((this.fog[b.ty]?.[b.tx] || 0) > 0) { mCtx.fillStyle = b.faction === FACTION.PLAYER ? '#60a5fa' : '#f87171'; mCtx.fillRect(b.tx * sx, b.ty * sy, b.size * sx + 1, b.size * sy + 1); }
        for (const u of this.units) {
            const tx = Math.floor(u.x / TILE_SIZE), ty = Math.floor(u.y / TILE_SIZE);
            if (u.faction === FACTION.ENEMY && this.fog[ty]?.[tx] !== 2) continue;
            mCtx.fillStyle = u.faction === FACTION.PLAYER ? (u.def.isCow ? '#fff' : '#38bdf8') : '#ef4444';
            mCtx.fillRect(tx * sx, ty * sy, 2.5, 2.5);
        }
        mCtx.strokeStyle = '#fde047'; mCtx.lineWidth = 1;
        mCtx.strokeRect((this.camX / (MAP_W * TILE_SIZE)) * mw, (this.camY / (MAP_H * TILE_SIZE)) * mh, ((this.canvas.width / this.zoom) / (MAP_W * TILE_SIZE)) * mw, ((this.canvas.height / this.zoom) / (MAP_H * TILE_SIZE)) * mh);
    }

    // --- 10. SIMPLIFIED UI ---
    updateUI() {
        const L = I18N[this.lang];
        const milkFloor = Math.floor(this.milk);
        document.getElementById('topMilkDisplay').textContent = `${milkFloor}/${this.maxMilk}`;

        const pUnits = this.units.filter(u => u.faction === FACTION.PLAYER);
        document.getElementById('popDisplay').textContent = `${pUnits.length}/${MAX_POP}`;
        document.getElementById('popBadge').classList.toggle('text-red-400', pUnits.length >= MAX_POP);
        document.getElementById('popBadge').classList.toggle('text-sky-300', pUnits.length < MAX_POP);

        if (this.selectedUnits.length > 0) {
            const u = this.selectedUnits[0];
            const extra = this.selectedUnits.length > 1 ? ` (x${this.selectedUnits.length})` : '';
            document.getElementById('selName').textContent = `${u.def.icon} ${this.entName(u.def)}${extra}`;
            document.getElementById('selStatsInline').textContent = u.def.isCow ? `🥛${Math.floor(u.milk)}%` : `❤️${Math.ceil(u.hp)} ⚔️${u.def.damage}`;
        } else if (this.selectedBuilding) {
            const b = this.selectedBuilding;
            document.getElementById('selName').textContent = `${b.def.icon} ${this.entName(b.def)}`;
            document.getElementById('selStatsInline').textContent = `❤️${Math.ceil(b.hp)}/${b.maxHp}`;
        } else {
            document.getElementById('selName').textContent = L.noSelection;
            document.getElementById('selStatsInline').textContent = `🐄 ${pUnits.filter(u => u.def.isCow).length}/${this.getMaxCows()}`;
        }
        this.renderCommandButtons();
    }

    findPlayerBuilding(type) {
        return this.buildings.find(b => b.faction === FACTION.PLAYER && b.type === type && b.built && b.hp > 0);
    }

    renderCommandButtons() {
        const grid = document.getElementById('commandGrid');
        const L = I18N[this.lang];
        const buttons = [];

        const pUnits = this.units.filter(u => u.faction === FACTION.PLAYER);
        const popFull = pUnits.length >= MAX_POP;
        const cowCount = pUnits.filter(u => u.def.isCow).length;
        const maxCows = this.getMaxCows();

        if (this.activeTab === 'recruit') {
            for (const uKey of ['krowa', 'drwal', 'mysliwy', 'wojownik', 'kaplan', 'rycerz']) {
                const uDef = UNIT_DEFS[uKey];
                const bld = this.findPlayerBuilding(uDef.reqBld) || (uKey === 'drwal' ? this.findPlayerBuilding('obora') : null);
                const reqName = this.entName(BUILDING_DEFS[uDef.reqBld]);
                const cowFull = uKey === 'krowa' && cowCount >= maxCows;
                const canAfford = this.milk >= uDef.cost;

                let sub = `${uDef.cost} 🥛`;
                if (!bld) sub = L.needBld(reqName);
                else if (popFull) sub = L.popFull;
                else if (cowFull) sub = L.cowLimit(cowCount, maxCows);
                else if (uKey === 'krowa') sub = `${uDef.cost}🥛 (${cowCount}/${maxCows})`;

                buttons.push({
                    id: `train_${uKey}`, icon: uDef.icon, label: this.entName(uDef), sub,
                    disabled: !bld || !canAfford || popFull || cowFull,
                    action: () => bld && this.trainUnitFromBuilding(bld, uKey)
                });
            }
        } else if (this.activeTab === 'build') {
            for (const bKey of ['obora', 'drwalnia', 'koszary', 'swiatynia', 'stajnia']) {
                const bDef = BUILDING_DEFS[bKey];
                buttons.push({
                    id: `build_${bKey}`, icon: bDef.icon, label: this.entName(bDef), sub: `${bDef.cost} 🥛`,
                    disabled: this.milk < bDef.cost,
                    action: () => this.startBuildingPlacement(bKey)
                });
            }
        } else if (this.activeTab === 'orders') {
            if (this.selectedUnits.length > 0) {
                const p = this.selectedUnits[0];
                buttons.push({ id: 'move', icon: '🥾', label: L.cmdMove, sub: '', action: () => this.setCommandMode('move') });
                buttons.push({ id: 'stop', icon: '✋', label: L.cmdStop, sub: '', action: () => this.stopSelectedUnits() });
                if (p.def.isCow) {
                    buttons.push({ id: 'graze', icon: '🌿', label: L.cmdGraze, sub: '', action: () => this.orderCowsGraze() });
                    buttons.push({ id: 'return_milk', icon: '🥛', label: L.cmdReturnMilk, sub: '', action: () => this.orderCowsReturn() });
                } else {
                    buttons.push({ id: 'attack', icon: '⚔️', label: L.cmdAttack, sub: '', action: () => this.setCommandMode('attack') });
                    buttons.push({ id: 'patrol', icon: '🔄', label: L.cmdPatrol, sub: '', action: () => this.setCommandMode('patrol') });
                }
                if (p.def.canChop) {
                    buttons.push({ id: 'chop', icon: '🪓', label: L.cmdChop, sub: '', action: () => this.setCommandMode('chop') });
                    buttons.push({ id: 'bridge', icon: '🌉', label: L.cmdBridge, sub: '50 🥛', action: () => this.setCommandMode('bridge') });
                }
                if (p.def.canHeal) {
                    buttons.push({ id: 'lightning', icon: '⚡', label: L.cmdLightning, sub: '35 ⚡', disabled: p.mana < 35, action: () => this.setCommandMode('lightning') });
                }
            }
        }

        const sig = `${this.lang}|${this.activeTab}|` + buttons.map(b => `${b.id}:${b.sub}:${b.disabled}:${this.commandMode === b.id}`).join('|');
        if (this._lastGridSig === sig) return;
        this._lastGridSig = sig;

        grid.innerHTML = '';
        if (this.activeTab === 'orders' && buttons.length === 0) {
            grid.innerHTML = `<div class="col-span-3 md:col-span-2 dos-inset p-2 text-center text-[11px] text-stone-300">${L.selectUnitFirst}</div>`;
            return;
        }
        for (const btn of buttons) {
            const el = document.createElement('button');
            el.className = `dos-btn px-1.5 py-1 flex flex-col justify-center text-left min-h-[38px] ${this.commandMode === btn.id ? 'active-cmd' : ''}`;
            if (btn.disabled) el.disabled = true;
            el.innerHTML = `
                <div class="flex items-center gap-1 w-full">
                    <span class="text-xs font-bold text-amber-200 truncate">${btn.icon} ${btn.label}</span>
                </div>
                ${btn.sub ? `<span class="text-[10px] ${btn.disabled ? 'text-red-300' : 'text-stone-300'} leading-none mt-0.5 truncate w-full">${btn.sub}</span>` : ''}`;
            el.onclick = () => btn.action();
            grid.appendChild(el);
        }
    }

    // --- 11. COMMANDS & INPUT ---
    setCommandMode(mode) {
        this.commandMode = mode; this.buildingToPlace = null; this.pendingBuildTile = null;
        document.getElementById('mobileBuildConfirmBar').classList.add('hidden');
        document.getElementById('cmdModeBanner').classList.toggle('hidden', !mode);
        this.updateUI();
    }

    startBuildingPlacement(bKey) {
        const def = BUILDING_DEFS[bKey];
        if (this.milk < def.cost) { this.setTicker(this.t('msgNeedMilk')); return; }
        this.commandMode = `build_${bKey}`; this.buildingToPlace = bKey;
        this.pendingBuildTile = {
            tx: Math.floor((this.camX + (this.canvas.width / this.zoom) / 2) / TILE_SIZE) - 1,
            ty: Math.floor((this.camY + (this.canvas.height / this.zoom) / 2) / TILE_SIZE) - 1
        };
        document.getElementById('mobileBuildConfirmBar').classList.remove('hidden');
        document.getElementById('cmdModeBanner').classList.add('hidden');
        this.updateUI();
    }

    canPlaceBuilding(tx, ty, size) {
        for (let y = ty; y < ty + size; y++) for (let x = tx; x < tx + size; x++) {
            if (!this.isWalkable(x, y) || this.map[y][x] === TILES.BRIDGE) return false;
        }
        return true;
    }

    trainUnitFromBuilding(b, uKey) {
        const def = UNIT_DEFS[uKey];
        const pUnits = this.units.filter(u => u.faction === FACTION.PLAYER);
        if (pUnits.length >= MAX_POP) { this.setTicker(this.t('msgPopCap')); return; }
        if (uKey === 'krowa' && pUnits.filter(u => u.def.isCow).length >= this.getMaxCows()) {
            this.setTicker(this.t('msgCowCap')); return;
        }
        if (this.milk < def.cost) { this.setTicker(this.t('msgNeedMilk')); return; }
        this.milk -= def.cost;
        const pos = this.findWalkableAround(b);
        const unit = this.spawnUnit(uKey, pos.tx, pos.ty, FACTION.PLAYER);
        if (unit) {
            if (def.isCow) sfx.play('moo'); else sfx.play('select');
            this.setTicker(`「 ${this.entName(def)}: "${this.entQuotes(def)[0]}" 」`);
        }
        this.updateUI();
    }

    stopSelectedUnits() { for (const u of this.selectedUnits) { u.state = u.def.isCow ? 'graze' : 'idle'; u.targetEntity = null; } this.setCommandMode(null); }
    orderCowsGraze() { for (const u of this.selectedUnits) if (u.def.isCow) u.state = 'graze'; sfx.play('moo'); this.setTicker(this.t('msgCowsGraze')); }
    orderCowsReturn() { for (const u of this.selectedUnits) if (u.def.isCow) u.state = 'return_milk'; sfx.play('moo'); this.setTicker(this.t('msgCowsReturn')); }

    issueSmartOrder(worldX, worldY, tx, ty) {
        if (this.selectedUnits.length === 0) return;
        const enemyU = this.units.find(u => u.faction === FACTION.ENEMY && Math.hypot(u.x - worldX, u.y - worldY) < 22);
        const enemyB = this.buildings.find(b => b.faction === FACTION.ENEMY && tx >= b.tx && tx < b.tx + b.size && ty >= b.ty && ty < b.ty + b.size);
        const shed = this.buildings.find(b => b.faction === FACTION.PLAYER && b.type === 'obora' && tx >= b.tx && tx < b.tx + b.size && ty >= b.ty && ty < b.ty + b.size);
        const tile = this.inBounds(tx, ty) ? this.map[ty][tx] : TILES.GRASS;

        this.selectedUnits.forEach((u, i) => {
            const ox = (i % 3 - 1) * 18, oy = (Math.floor(i / 3) - 1) * 18;
            if (u.def.isCow) {
                if (shed) u.state = 'return_milk';
                else { u.state = 'move'; u.targetX = worldX + ox; u.targetY = worldY + oy; }
                return;
            }
            if (enemyU || enemyB) { u.state = 'attack'; u.targetEntity = enemyU || enemyB; }
            else if (u.def.canChop && tile === TILES.FOREST) { u.state = 'chop'; u.targetTile = { tx, ty }; }
            else if (u.def.canBuildBridge && tile === TILES.WATER) {
                if (this.milk >= 50) { this.milk -= 50; u.state = 'build_bridge'; u.targetTile = { tx, ty }; }
                else this.setTicker(this.t('msgBridgeNeedMilk'));
            } else { u.state = 'move'; u.targetEntity = null; u.targetX = worldX + ox; u.targetY = worldY + oy; }
        });

        const p = this.selectedUnits[0];
        if (p.def.isCow) sfx.play('moo'); else sfx.play('order');
        const q = this.entQuotes(p.def);
        this.setTicker(`「 ${this.entName(p.def)}: "${q[Math.floor(Math.random() * q.length)]}" 」`);
        this.spawnHitParticles(worldX, worldY, '#a3e635');
    }

    screenToWorld(sx, sy) { return { wx: sx / this.zoom + this.camX, wy: sy / this.zoom + this.camY }; }

    setupEvents() {
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
            if (e.code === 'Escape') this.setCommandMode(null);
            if (e.code === 'KeyS') this.stopSelectedUnits();
        });
        window.addEventListener('keyup', (e) => this.keys[e.code] = false);
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouse.x = e.clientX - rect.left; this.mouse.y = e.clientY - rect.top;
            const { wx, wy } = this.screenToWorld(this.mouse.x, this.mouse.y);
            this.mouse.worldX = wx; this.mouse.worldY = wy;
            if (this.commandMode && this.commandMode.startsWith('build_') && !this.isMobileMode) {
                this.pendingBuildTile = { tx: Math.floor(wx / TILE_SIZE), ty: Math.floor(wy / TILE_SIZE) };
            }
            if (this.mouse.down && !this.commandMode && Math.hypot(this.mouse.x - this.mouse.startX, this.mouse.y - this.mouse.startY) > 8) this.mouse.drag = true;
        });

        this.canvas.addEventListener('mousedown', (e) => {
            if (this.touchState.active) return;
            const rect = this.canvas.getBoundingClientRect();
            this.mouse.x = e.clientX - rect.left; this.mouse.y = e.clientY - rect.top;
            const { wx, wy } = this.screenToWorld(this.mouse.x, this.mouse.y);
            const tx = Math.floor(wx / TILE_SIZE), ty = Math.floor(wy / TILE_SIZE);
            if (e.button === 2) { if (this.commandMode) this.setCommandMode(null); else this.issueSmartOrder(wx, wy, tx, ty); return; }
            if (e.button === 0) {
                if (this.commandMode) { this.executeCommandModeAt(wx, wy, tx, ty, !this.isMobileMode); return; }
                this.mouse.down = true; this.mouse.startX = this.mouse.x; this.mouse.startY = this.mouse.y; this.mouse.drag = false;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (this.touchState.active || e.button !== 0 || !this.mouse.down) return;
            this.mouse.down = false;
            if (this.mouse.drag) { this.finishBoxSelection(this.mouse.startX, this.mouse.startY, this.mouse.x, this.mouse.y); this.mouse.drag = false; }
            else { const { wx, wy } = this.screenToWorld(this.mouse.x, this.mouse.y); this.handleTapOrClickAt(wx, wy, false); }
        });

        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!this.isMobileMode) { this.isMobileMode = true; this.applyMobileModeUI(); }
            const rect = this.canvas.getBoundingClientRect();
            if (e.touches.length === 2) {
                this.touchState.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                return;
            }
            const t = e.touches[0], sx = t.clientX - rect.left, sy = t.clientY - rect.top;
            this.touchState = { active: true, startX: sx, startY: sy, camStartX: this.camX, camStartY: this.camY, moved: false, pinchDist: 0 };
            this.mouse.startX = sx; this.mouse.startY = sy; this.mouse.x = sx; this.mouse.y = sy;
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = this.canvas.getBoundingClientRect();
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (this.touchState.pinchDist > 20) this.setZoom(this.zoom + (dist - this.touchState.pinchDist) * 0.004);
                this.touchState.pinchDist = dist;
                return;
            }
            const t = e.touches[0], sx = t.clientX - rect.left, sy = t.clientY - rect.top;
            this.mouse.x = sx; this.mouse.y = sy;
            const { wx, wy } = this.screenToWorld(sx, sy);
            if (Math.hypot(sx - this.touchState.startX, sy - this.touchState.startY) > 10) this.touchState.moved = true;
            if (this.commandMode && this.commandMode.startsWith('build_')) { this.pendingBuildTile = { tx: Math.floor(wx / TILE_SIZE), ty: Math.floor(wy / TILE_SIZE) }; return; }
            if (this.touchState.moved) {
                if (this.touchInteractionMode === 'box') this.mouse.drag = true;
                else {
                    this.camX = this.touchState.camStartX - (sx - this.touchState.startX) / this.zoom;
                    this.camY = this.touchState.camStartY - (sy - this.touchState.startY) / this.zoom;
                    this.clampCamera();
                }
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) return;
            const { wx, wy } = this.screenToWorld(this.mouse.x, this.mouse.y);
            const tx = Math.floor(wx / TILE_SIZE), ty = Math.floor(wy / TILE_SIZE);
            if (this.mouse.drag && this.touchInteractionMode === 'box') {
                this.finishBoxSelection(this.mouse.startX, this.mouse.startY, this.mouse.x, this.mouse.y);
                this.mouse.drag = false; this.touchInteractionMode = 'smart'; this.updateTouchModeButtons();
            } else if (!this.touchState.moved) {
                if (this.commandMode) {
                    if (this.commandMode.startsWith('build_') && this.buildingToPlace) {
                        const def = BUILDING_DEFS[this.buildingToPlace];
                        if (this.pendingBuildTile && tx >= this.pendingBuildTile.tx && tx < this.pendingBuildTile.tx + def.size && ty >= this.pendingBuildTile.ty && ty < this.pendingBuildTile.ty + def.size) {
                            this.executeCommandModeAt(wx, wy, this.pendingBuildTile.tx, this.pendingBuildTile.ty, true);
                        } else this.pendingBuildTile = { tx, ty };
                    } else this.executeCommandModeAt(wx, wy, tx, ty, true);
                } else this.handleTapOrClickAt(wx, wy, true);
            }
            setTimeout(() => { this.touchState.active = false; }, 80);
        }, { passive: false });

        const jumpMini = (cx, cy) => {
            const r = this.minimap.getBoundingClientRect();
            this.centerCameraOn(((cx - r.left) / r.width) * MAP_W * TILE_SIZE, ((cy - r.top) / r.height) * MAP_H * TILE_SIZE);
        };
        this.minimap.addEventListener('mousedown', (e) => jumpMini(e.clientX, e.clientY));
        this.minimap.addEventListener('touchstart', (e) => { e.preventDefault(); jumpMini(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        document.getElementById('missionSelect').onchange = (e) => this.loadMission(e.target.value);
        document.getElementById('musicToggleBtn').onclick = (e) => {
            const on = sfx.toggleMusic();
            e.currentTarget.classList.toggle('active-cmd', on);
            e.currentTarget.textContent = on ? '🎵' : '🔇';
        };
        document.getElementById('topLangBtn').onclick = () => this.toggleLanguage();
        document.getElementById('tabRecruitBtn').onclick = () => this.setTab('recruit');
        document.getElementById('tabBuildBtn').onclick = () => this.setTab('build');
        document.getElementById('tabOrdersBtn').onclick = () => this.setTab('orders');
        document.getElementById('openSaveModalBtn').onclick = () => this.openSaveModal();
        document.getElementById('closeSaveModalBtn').onclick = () => document.getElementById('saveModalOverlay').classList.add('hidden');
        document.getElementById('openMenuModalBtn').onclick = () => this.openMenuModal();
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('modalOverlay').classList.add('hidden');
        document.getElementById('cancelCmdBtn').onclick = () => this.setCommandMode(null);
        document.getElementById('cancelBuildBtn').onclick = () => this.setCommandMode(null);
        document.getElementById('confirmBuildBtn').onclick = () => {
            if (this.pendingBuildTile && this.buildingToPlace) this.executeCommandModeAt(0, 0, this.pendingBuildTile.tx, this.pendingBuildTile.ty, true);
        };

        document.getElementById('touchModeSmartBtn').onclick = () => { this.touchInteractionMode = 'smart'; this.updateTouchModeButtons(); };
        document.getElementById('touchModeBoxBtn').onclick = () => { this.touchInteractionMode = 'box'; this.updateTouchModeButtons(); };
        document.getElementById('selectAllFightersBtn').onclick = () => {
            const f = this.units.filter(u => u.faction === FACTION.PLAYER && !u.def.isCow);
            if (f.length) { this.selectedUnits = f; this.selectedBuilding = null; sfx.play('select'); this.setTab('orders'); this.updateUI(); }
        };
        document.getElementById('homeCamBtn').onclick = () => {
            const shed = this.buildings.find(b => b.faction === FACTION.PLAYER);
            if (shed) this.centerCameraOn(shed.x, shed.y);
        };
        document.getElementById('zoomInBtn').onclick = () => this.setZoom(this.zoom + 0.2);
        document.getElementById('zoomOutBtn').onclick = () => this.setZoom(this.zoom - 0.2);
        document.getElementById('toggleHudDrawerBtn').onclick = (e) => {
            const hud = document.getElementById('hudSidebar');
            const hidden = hud.classList.toggle('hidden');
            e.currentTarget.textContent = hidden ? '▲ HUD' : '▼ HUD';
            this.resize();
        };
    }

    setZoom(z) { this.zoom = Math.max(0.6, Math.min(1.6, z)); this.clampCamera(); }

    finishBoxSelection(sx1, sy1, sx2, sy2) {
        const p1 = this.screenToWorld(Math.min(sx1, sx2), Math.min(sy1, sy2));
        const p2 = this.screenToWorld(Math.max(sx1, sx2), Math.max(sy1, sy2));
        const boxed = this.units.filter(u => u.faction === FACTION.PLAYER && u.x >= p1.wx && u.x <= p2.wx && u.y >= p1.wy && u.y <= p2.wy);
        if (boxed.length) { this.selectedUnits = boxed; this.selectedBuilding = null; sfx.play('select'); this.setTab('orders'); }
        this.updateUI();
    }

    handleTapOrClickAt(wx, wy, isTouch) {
        const tx = Math.floor(wx / TILE_SIZE), ty = Math.floor(wy / TILE_SIZE);
        const u = this.units.find(u => u.faction === FACTION.PLAYER && Math.hypot(u.x - wx, u.y - wy) < 22);
        if (u) {
            this.selectedUnits = [u]; this.selectedBuilding = null;
            if (u.def.isCow) sfx.play('moo'); else sfx.play('select');
            this.setTab('orders'); this.updateUI(); return;
        }
        const b = this.buildings.find(b => b.faction === FACTION.PLAYER && tx >= b.tx && tx < b.tx + b.size && ty >= b.ty && ty < b.ty + b.size);
        if (b) { this.selectedUnits = []; this.selectedBuilding = b; sfx.play('select'); this.setTab('recruit'); this.updateUI(); return; }
        if ((isTouch || this.isMobileMode) && this.selectedUnits.length > 0) this.issueSmartOrder(wx, wy, tx, ty);
        else { this.selectedUnits = []; this.selectedBuilding = null; this.updateUI(); }
    }

    executeCommandModeAt(worldX, worldY, tx, ty, confirmed = false) {
        const mode = this.commandMode;
        if (!mode) return;
        if (mode.startsWith('build_') && this.buildingToPlace) {
            if (!confirmed) { this.pendingBuildTile = { tx, ty }; return; }
            const def = BUILDING_DEFS[this.buildingToPlace];
            if (this.milk >= def.cost && this.canPlaceBuilding(tx, ty, def.size)) {
                this.milk -= def.cost; this.spawnBuilding(this.buildingToPlace, tx, ty, FACTION.PLAYER, false);
                sfx.play('build'); this.setTicker(this.t('msgBuildStart')(this.entName(def))); this.setCommandMode(null);
            } else this.setTicker(this.t('msgInvalidPlace'));
            return;
        }
        if (mode === 'move') this.issueSmartOrder(worldX, worldY, tx, ty);
        else if (mode === 'attack') { for (const u of this.selectedUnits) if (!u.def.isCow) { u.state = 'attack'; u.targetX = worldX; u.targetY = worldY; u.targetEntity = null; } sfx.play('order'); }
        else if (mode === 'patrol') { for (const u of this.selectedUnits) if (!u.def.isCow) { u.state = 'patrol'; u.patrolOriginX = u.x; u.patrolOriginY = u.y; u.targetX = worldX; u.targetY = worldY; } sfx.play('order'); }
        else if (mode === 'chop') {
            if (this.inBounds(tx, ty) && this.map[ty][tx] === TILES.FOREST) { for (const u of this.selectedUnits) if (u.def.canChop) { u.state = 'chop'; u.targetTile = { tx, ty }; } sfx.play('chop'); }
            else this.setTicker(this.t('msgClickForest'));
        } else if (mode === 'bridge') {
            if (this.inBounds(tx, ty) && this.map[ty][tx] === TILES.WATER) {
                if (this.milk >= 50) { this.milk -= 50; const d = this.selectedUnits.find(u => u.def.canBuildBridge); if (d) { d.state = 'build_bridge'; d.targetTile = { tx, ty }; sfx.play('order'); } }
                else this.setTicker(this.t('msgBridgeNeedMilk'));
            } else this.setTicker(this.t('msgClickRiver'));
        } else if (mode === 'lightning') {
            const pr = this.selectedUnits.find(u => u.def.canHeal && u.mana >= 35);
            if (pr) {
                pr.mana -= 35; sfx.play('lightning');
                for (const u of this.units) if (u.faction === FACTION.ENEMY && Math.hypot(u.x - worldX, u.y - worldY) < 56) u.hp -= 65;
                for (let i = 0; i < 14; i++) this.spawnHitParticles(worldX + (Math.random() - 0.5) * 40, worldY + (Math.random() - 0.5) * 40, '#38bdf8');
                this.addFloatingText(this.t('msgPerunBolt'), worldX, worldY - 12, '#38bdf8');
            }
        }
        this.setCommandMode(null);
    }

    spawnHitParticles(x, y, color) { for (let i = 0; i < 6; i++) this.particles.push({ x, y, vx: (Math.random() - 0.5) * 2.4, vy: (Math.random() - 0.5) * 2.4, color, life: 14 }); }
    addFloatingText(text, x, y, color = '#fff') { this.floatingTexts.push({ text, x, y, color, life: 45 }); }
    setTicker(msg) { const b = document.getElementById('mobileTicker'); if (b) b.textContent = msg; }
    centerCameraOn(wx, wy) { this.camX = wx - (this.canvas.width / this.zoom) / 2; this.camY = wy - (this.canvas.height / this.zoom) / 2; this.clampCamera(); }
    clampCamera() {
        const vw = this.canvas.width / this.zoom, vh = this.canvas.height / this.zoom;
        this.camX = Math.max(0, Math.min(Math.max(0, MAP_W * TILE_SIZE - vw), this.camX));
        this.camY = Math.max(0, Math.min(Math.max(0, MAP_H * TILE_SIZE - vh), this.camY));
    }
    resize() {
        const c = document.getElementById('viewportContainer');
        this.canvas.width = c.clientWidth; this.canvas.height = c.clientHeight;
        this.clampCamera();
    }
    loop() { this.update(); this.render(); requestAnimationFrame(() => this.loop()); }
}

window.onload = () => { window.malopolanieGame = new MalopolanieGame(); };
</script>
